<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>样片：封面 + 学习</title>
<style>
@font-face{font-family:DeckSans;font-weight:400;src:url(fonts/DeckSans-400.woff2) format("woff2")}
@font-face{font-family:DeckSans;font-weight:700;src:url(fonts/DeckSans-700.woff2) format("woff2")}
@font-face{font-family:DeckMono;font-weight:700;src:url(fonts/DeckMono-700.woff2) format("woff2")}
html,body{margin:0;height:100%;background:#FFFBF5;overflow:hidden;font-family:DeckSans,"Noto Sans CJK SC",sans-serif}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;background:#FFFBF5;overflow:hidden;transform-origin:0 0}
#stage *{position:absolute;box-sizing:border-box}
.mask{overflow:hidden}
#title{left:55px;top:170px;width:1000px;font-weight:700;font-size:124px;line-height:1.12;color:#A97EFE;letter-spacing:-.01em}
#title .ln{position:relative;display:block;height:139px}
#title .ln span{position:absolute;left:0;top:0;white-space:nowrap}
#sub{left:58px;top:470px;font-size:40px;color:#1b1b1f;white-space:nowrap}
#wm{left:55px;top:65px;width:324px}
#sx{left:55px;top:993px;width:263px}
#mclip{left:720px;top:0;width:1200px;height:1080px;overflow:hidden}
#mclip .pc{overflow:hidden}
#mclip .pc img{max-width:none}
#drop{left:1366px;top:305px;width:324px;height:324px;opacity:0}
#flood{border-radius:50%;background:#A97EFE;opacity:0}
.panel{top:0;width:640px;height:1080px;overflow:hidden}
.panel .bg{inset:0}
.panel .ph{left:0;top:0;width:640px;height:700px;overflow:hidden}
.panel .ph img{left:0;top:0;width:640px;height:700px;object-fit:cover}
.panel .nm{left:56px;top:722px;width:560px;height:150px;overflow:hidden;color:#fff}
.panel .nm b{position:absolute;left:0;top:0;font-size:66px;font-weight:700;white-space:nowrap;line-height:1.1}
.panel .nm i{position:absolute;left:2px;top:86px;font:700 28px DeckMono,monospace;font-style:normal;opacity:.85;white-space:nowrap}
.hl{top:0;width:3px;height:1080px;background:#FFFBF5}
#bot{left:890px;top:905px;width:140px;height:140px}
#bot svg{width:100%;height:100%;overflow:visible}
#botlab{left:1052px;top:952px;font:700 32px DeckMono,monospace;color:#fff;white-space:nowrap}
#streams{left:0;top:0;width:1920px;height:1080px;overflow:visible}
#logo{left:1846px;top:34px;width:44px;height:44px;opacity:0}
#logo svg{width:100%;height:100%}
#curtain{inset:0;background:#FFFBF5;opacity:0;pointer-events:none}
</style>
</head>
<body>
<div id="stage"></div>
<script src="dist/sample.js?v=1795757626"></script>
</body>
</html>
